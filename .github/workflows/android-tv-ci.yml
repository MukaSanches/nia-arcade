name: Android TV CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout NIA Arcade
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch pinned upstream games
        run: |
          rm -rf vendor/100htmlgameshub
          git clone https://github.com/shendds/100htmlgameshub.git vendor/100htmlgameshub
          git -C vendor/100htmlgameshub checkout cdf426cc619f3c713af1d73d485112444bace7c3

      - name: Import and adapt 100 TV games
        run: python3 tools/import_games.py vendor/100htmlgameshub

      - name: Validate game catalog
        run: python3 tools/validate_games.py

      - name: Web boot smoke test
        run: python3 tools/smoke_games.py

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build installable APK
        run: gradle --no-daemon assembleDebug

      - name: Package Genesis artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NIA-Arcade-v1.0.0.apk
          sha256sum NIA-Arcade-v1.0.0.apk | tee NIA-Arcade-v1.0.0.sha256
          ls -lh NIA-Arcade-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIA-Arcade-v1.0.0-Genesis
          path: |
            NIA-Arcade-v1.0.0.apk
            NIA-Arcade-v1.0.0.sha256
          if-no-files-found: error
          retention-days: 30
